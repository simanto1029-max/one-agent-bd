<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Agent BD - Pricing</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--ink:#0e1629;--muted:#5a6781;--violet:#7c3aed;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.pr{position:relative;overflow:hidden;isolation:isolate;padding:clamp(48px,6vw,90px) clamp(16px,4vw,56px);background:linear-gradient(180deg,#fff,#faf8ff 40%,#f6f2ff)}
.pr::before{content:"";position:absolute;left:50%;top:-120px;width:min(900px,120vw);aspect-ratio:1;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(124,58,237,.16),transparent);z-index:-1}
.pr::after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(124,58,237,.13) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:radial-gradient(ellipse 60% 45% at 50% 20%,#000,transparent 80%);mask-image:radial-gradient(ellipse 60% 45% at 50% 20%,#000,transparent 80%)}
.head{text-align:center;max-width:720px;margin:0 auto}
.badge{display:inline-block;padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;color:#6d28d9;background:rgba(124,58,237,.07);border:1px solid rgba(124,58,237,.22)}
h2{font-size:clamp(28px,3.6vw,46px);font-weight:800;letter-spacing:-.035em;line-height:1.1;margin:16px 0 12px}
.head p{font-size:clamp(14px,1.3vw,16px);line-height:1.65;color:var(--muted)}
.head small{display:block;margin-top:10px;font-size:12px;color:#8b94ad}
.bill{display:flex;justify-content:center;margin:26px 0 42px}
.bill div{display:inline-flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:999px;background:#fff;border:1px solid rgba(124,58,237,.2);box-shadow:0 10px 26px -14px rgba(76,29,149,.4);font-size:12.5px;font-weight:600;color:var(--muted)}
.bill b{padding:5px 12px;border-radius:999px;color:#fff;font-size:12px;background:linear-gradient(135deg,#8b3dff,#6d28d9)}
.grid{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px);align-items:stretch}
.card{position:relative;display:flex;flex-direction:column;padding:28px 26px 26px;border-radius:30px;background:#fff;border:1px solid rgba(14,22,41,.08);box-shadow:0 30px 60px -36px rgba(60,20,140,.35);opacity:0;transform:translateY(46px) scale(.97);transition:box-shadow .35s,translate .35s}
.card:hover{translate:0 -8px;box-shadow:0 44px 80px -34px rgba(91,33,182,.5)}
.spot{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(124,58,237,.12),transparent 70%)}
.card:hover .spot{opacity:1}
.pop{background:linear-gradient(180deg,#fff,#fbf8ff);box-shadow:0 40px 90px -34px rgba(124,58,237,.65);z-index:1}
.pop::before{content:"";position:absolute;inset:-1.5px;border-radius:31px;padding:2px;pointer-events:none;background:conic-gradient(from var(--a),#7c3aed,#d8c2ff,#6366f1,#a855f7,#7c3aed);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);animation:spin 5s linear infinite}
@keyframes spin{to{--a:360deg}}
.tag{position:absolute;left:50%;top:0;translate:-50% -50%;padding:6px 16px;border-radius:999px;font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#8b3dff,#5b3df0);box-shadow:0 10px 22px -6px rgba(91,61,240,.7);overflow:hidden;white-space:nowrap}
.tag::after{content:"";position:absolute;top:0;bottom:0;width:30px;left:-40px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out 2s infinite}
@keyframes shine{0%{left:-40px}50%,100%{left:130%}}
.top{display:flex;justify-content:space-between;align-items:center}
.top h3{font-size:20px;font-weight:800;letter-spacing:-.02em}
.free{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#475069;background:#eef0f6}
.price{display:flex;align-items:baseline;gap:6px;margin-top:16px;font-weight:800;letter-spacing:-.04em}
.price strong{font-size:clamp(38px,4vw,48px);line-height:1}
.price em{font-style:normal;font-size:13px;font-weight:600;letter-spacing:0;color:#8b94ad}
.sub{margin-top:8px;font-size:13px;color:var(--muted);font-weight:500}
.btn{position:relative;overflow:hidden;display:block;margin-top:20px;padding:14px;border-radius:14px;text-align:center;font:700 14px inherit;font-family:inherit;text-decoration:none;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:50px;left:-70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg)}
.btn:hover::after{left:120%;transition:left .7s}
.b-light{color:var(--ink);background:#f1f3f8;border:1px solid rgba(14,22,41,.08)}
.b-violet{color:#fff;background:linear-gradient(135deg,#8b3dff,#6d28d9);box-shadow:0 18px 34px -12px rgba(109,40,217,.7),inset 0 1px 0 rgba(255,255,255,.35)}
.b-dark{color:#fff;background:linear-gradient(135deg,#1a2540,#0b1121);box-shadow:0 18px 34px -12px rgba(11,17,33,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.fl{margin:22px 0 14px;padding-top:16px;border-top:1px solid rgba(14,22,41,.08);font-size:11px;font-weight:800;letter-spacing:.1em;color:#97a0b8}
ul{list-style:none;display:grid;gap:12px}
li{display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.5;font-weight:500;color:#2a3652;opacity:0;transform:translateX(-12px)}
li svg{flex:none;width:18px;height:18px;margin-top:1px}
li.lock{color:#a2aabf;text-decoration:line-through}
.ck circle{fill:rgba(16,185,129,.14)}.ck path{fill:none;stroke:#10b981;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14}
/* motion */
.in .head>*,.in .bill{animation:up .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0)*1s)}
.head>*,.bill{opacity:0}
.in .head>*,.in .bill{opacity:1}
.in .card{animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.45s + var(--i)*.14s)}
.in li{animation:slide .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.9s + var(--i)*.14s + var(--k)*.06s)}
.in .ck path{animation:tick .5s ease forwards;animation-delay:calc(1s + var(--i)*.14s + var(--k)*.06s)}
.in .pop{animation:rise .95s cubic-bezier(.2,.8,.2,1) forwards,glow 4s ease-in-out 2s infinite;animation-delay:calc(.45s + var(--i)*.14s),2s}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes slide{to{opacity:1;transform:none}}
@keyframes tick{to{stroke-dashoffset:0}}
@keyframes glow{50%{box-shadow:0 44px 110px -30px rgba(124,58,237,.9)}}
@media (min-width:901px){.pop{margin-top:-14px;margin-bottom:-14px;padding-top:34px}}
@media (max-width:900px){.grid{grid-template-columns:1fr;max-width:460px}.pop{order:-1;margin-top:14px}}
@media (prefers-reduced-motion:reduce){.in *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<section class="pr" id="pr">
  <div class="head">
    <span class="badge" style="--d:0">Pricing</span>
    <h2 style="--d:.1">Simple plans that grow with your business</h2>
    <p style="--d:.2">Start small, then add channels and automation as you need them. Every plan includes autonomous AI replies.</p>
    <small style="--d:.3">Facebook &amp; Instagram conversations: 100% Unlimited &bull; WhatsApp Cloud API: Direct Meta billing</small>
  </div>
  <div class="bill" style="--d:.4"><div>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
    Billing Duration: <b>1 Month</b>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b94ad" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
  </div></div>
  <div class="grid" id="grid"></div>
</section>
<script>
var PLANS=[
 {n:'Basic',tag:'2 Days Free',p:0,u:'/ 2 days',s:'Build One Business Agent',b:'Start 2-day free trial',c:'b-light',f:[
  'Facebook Unlimited conversations','Instagram Unlimited conversations','!WhatsApp Unlimited conversations (Locked in 2-day trial)','1 AI business agent','Bangla voice note & photo AI','Auto comment & inbox reply','1-Click courier booking (Steadfast & Pathao)','Unified team inbox','Standard AI reply speed']},
 {n:'Starter AI Plan',pop:1,p:1250,u:'/ month',s:'Manage Multiple Business',b:'Choose Starter AI Plan',c:'b-violet',f:[
  '24/7 Active AI Sales & Auto-Reply Agent (Up to 3 Channels)','1-Click Steadfast, Pathao & RedX Courier Dispatch','AI Auto Customer Fraud & Courier Delivery Ratio Check','AI Auto Delivery Tracking & Customer Live Status Update','VIP Customer Retargeting & Smart Follow-Up Message','WhatsApp, Facebook Messenger & Instagram Auto-Reply','Voice Note AI Listening & Product Photo Recognition','Auto Post Comment Reply + Direct Inbox (DM) Automation','Unlimited Product Catalog & Autonomous Chat Order Capture','Unlimited Customer Conversations (0 TK per-msg fee)']},
 {n:'Pro Business Plan',p:1950,u:'/ month',s:'Scale Your Client Base',b:'Choose Pro Business Plan',c:'b-dark',f:[
  'Everything in Starter Plan + Connect up to 10 Channels','Accounts, Stock & Profit ERP (Sales, Purchase, Due & Cashbook)','AI Appointments & Google Calendar Auto-Slot Booking','Website, WooCommerce & Shopify Store Sync + Live Chat Widget','AI Auto Delivery Tracking & Customer Live Status Update','VIP Customer Retargeting Message & AI Email Marketing','1-Click Steadfast, Pathao & RedX Courier Dispatch','AI Auto Customer Fraud & Courier Delivery Ratio Check','Customer Callback Queue, Human Handover & CSV/Text Export','3 Autonomous AI Sales Agents & 24/7 VIP Priority Support']}
];
var CK='<svg class="ck" viewBox="0 0 18 18"><circle cx="9" cy="9" r="9"/><path d="M5.2 9.3l2.5 2.5 5-5.2"/></svg>',
    LK='<svg viewBox="0 0 18 18" fill="none" stroke="#a2aabf" stroke-width="1.6" stroke-linecap="round"><rect x="4" y="8" width="10" height="7" rx="2"/><path d="M6.5 8V6a2.5 2.5 0 015 0v2"/></svg>';
var g=document.getElementById('grid');
g.innerHTML=PLANS.map(function(P,i){
  return '<article class="card'+(P.pop?' pop':'')+'" style="--i:'+i+'"><div class="spot"></div>'+(P.pop?'<span class="tag">Most popular</span>':'')+
  '<div class="top"><h3>'+P.n+'</h3>'+(P.tag?'<span class="free">'+P.tag+'</span>':'')+'</div>'+
  '<div class="price"><strong>&#2547;<span data-to="'+P.p+'">0</span></strong><em>'+P.u+'</em></div><div class="sub">'+P.s+'</div>'+
  '<a href="#" class="btn '+P.c+'">'+P.b+'</a><div class="fl">FEATURES</div><ul>'+
  P.f.map(function(t,k){var l=t[0]==='!';return '<li class="'+(l?'lock':'')+'" style="--k:'+k+'">'+(l?LK:CK)+'<span>'+(l?t.slice(1):t)+'</span></li>'}).join('')+
  '</ul></article>';
}).join('');
[].forEach.call(g.children,function(c){c.addEventListener('pointermove',function(e){var r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')})});
var root=document.getElementById('pr');
function count(){[].forEach.call(document.querySelectorAll('[data-to]'),function(el,i){
  var to=+el.dataset.to,t0=performance.now()+700+i*140,d=1500;
  (function s(n){var p=Math.min(Math.max((n-t0)/d,0),1);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('en-US');if(p<1)requestAnimationFrame(s)})(performance.now());})}
function go(){root.classList.add('in');count()}
if('IntersectionObserver' in window){new IntersectionObserver(function(e,o){if(e[0].isIntersecting){go();o.disconnect()}},{threshold:.15}).observe(root)}else go();
</script>
</body>
</html>
