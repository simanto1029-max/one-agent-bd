    <script>
      (function () {
        var noise = ['[vite]', 'websocket', 'react devtools', 'download the react devtools', 'hmr', 'initial session check'];
        function isNoise(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function (a) {
              return typeof a === 'string' ? a : (a && a.message) ? a.message : String(a);
            }).join(' ').toLowerCase();
            return noise.some(function (n) { return msg.indexOf(n) !== -1; });
          } catch (e) { return false; }
        }
        ['log', 'info', 'debug', 'warn', 'error'].forEach(function (fn) {
          var orig = console[fn] && console[fn].bind(console);
          if (!orig) return;
          console[fn] = function () {
            if (isNoise(arguments)) return;
            if (fn === 'log' || fn === 'info' || fn === 'debug' || fn === 'warn') return;
            return orig.apply(console, arguments);
          };
        });
        var OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function (url, protocols) {
            var u = String(url || '');
            if (u.indexOf('24678') !== -1 || protocols === 'vite-hmr') {
              return {
                readyState: 3,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {}
              };
            }
            return protocols ? new OrigWS(url, protocols) : new OrigWS(url);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }
      })();
